name: Dependency security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-security:
    name: npm-security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_dependency_security.py
      - run: python tools/dependency_security.py npm
      - name: Verify manifests were not modified
        if: always()
        run: git diff --exit-code -- frontend/package.json frontend/package-lock.json backend/requirements.txt backend/requirements-dev.txt

  python-security:
    name: python-security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.1
      - run: python tools/dependency_security.py python
      - name: Verify manifests were not modified
        if: always()
        run: git diff --exit-code -- frontend/package.json frontend/package-lock.json backend/requirements.txt backend/requirements-dev.txt
