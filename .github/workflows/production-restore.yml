name: Production restore drill
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RESTORE-ISOLATED to acknowledge the private data drill'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: production-restore-drill
  cancel-in-progress: false
jobs:
  restore:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'RESTORE-ISOLATED'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Configure required reviewers and main-only deployment branches BEFORE adding secret.
    environment: production-recovery
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-restore-password
          POSTGRES_DB: fittrack_test_production_restore
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d fittrack_test_production_restore"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install pinned application dependencies before accessing source credential
        run: python -m pip install -r backend/requirements.txt
      - name: Snapshot, restore and application smoke
        env:
          FITTRACK_BACKUP_SOURCE_URL: ${{ secrets.FITTRACK_BACKUP_SOURCE_URL }}
          FITTRACK_RESTORE_TEST_URL: postgresql://postgres:disposable-restore-password@127.0.0.1:5432/fittrack_test_production_restore?sslmode=disable
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: python -m tools.production_restore_drill
      - name: Remove isolated database container
        if: always()
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: docker rm --force --volumes "$POSTGRES_CONTAINER" >/dev/null 2>&1 || true
      # Intentionally no artifacts, cache, database logs, or raw exception output.
