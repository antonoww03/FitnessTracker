name: FitnessTracker checks
on:
  pull_request:
  push:
    branches: [main, fix/full-functional-audit]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      FITTRACK_AUTO_BACKUP: '0'
      FITTRACK_DB_PATH: /tmp/fittrack-ci.sqlite3
      FITTRACK_E2E_URL: http://127.0.0.1:8000
      REACT_APP_BACKEND_URL: ''
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.txt pytest==8.3.5
      - run: npm ci --prefix frontend
      - run: python -m pytest tests -q
      - run: npm run test:features --prefix frontend
      - run: npm run test:offline --prefix frontend
      - run: npm run test:reminders --prefix frontend
      - run: node frontend/tests/service-worker.cjs
      - run: npm run build --prefix frontend
      - name: Build and smoke-test production image
        run: |
          docker build -t fittrack-ci .
          docker run -d --name fittrack-ci -p 18000:8000 \
            -e FITTRACK_COOKIE_SECURE=0 \
            -e FITTRACK_AUTO_BACKUP=0 \
            -e FITTRACK_DB_PATH=/tmp/fittrack.sqlite3 \
            fittrack-ci
          trap 'docker rm -f fittrack-ci' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(60):
              try:
                  assert urllib.request.urlopen('http://127.0.0.1:18000/api', timeout=2).status == 200
                  assert urllib.request.urlopen('http://127.0.0.1:18000/', timeout=2).status == 200
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('Production container did not become ready')
          PY
      - name: Install browser for UI checks
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start disposable application
        env:
          FITTRACK_COOKIE_SECURE: '0'
        run: |
          python -m backend.serve > /tmp/fittrack-ci.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for attempt in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2)
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('Application did not start')
          PY
      - run: npm run test:e2e --prefix frontend
      - run: node frontend/tests/profile.cjs
      - run: npm run test:mobile --prefix frontend
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mobile-screenshots
          path: frontend/test-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-test-password
          POSTGRES_DB: fittrack_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d fittrack_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FITTRACK_TEST_POSTGRES_URL: postgresql://postgres:disposable-test-password@127.0.0.1:5432/fittrack_test?sslmode=disable
      FITTRACK_AUTO_BACKUP: '0'
      FITTRACK_PUSH_WORKER: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt pytest==8.3.5
      - run: python -m pytest tests -q
