    <script>
        (function () {
            // BLOCK script injection
            const originalAppendChild = Element.prototype.appendChild;
            const originalInsertBefore = Element.prototype.insertBefore;

            Element.prototype.appendChild = function (child) {
                if (
                    child.tagName === "SCRIPT" &&
                    child.src &&
                    child.src.includes("emergent")
                ) {
                    console.log("BLOCKED:", child.src);
                    return child;
                }
                return originalAppendChild.call(this, child);
            };

            Element.prototype.insertBefore = function (child, ref) {
                if (
                    child.tagName === "SCRIPT" &&
                    child.src &&
                    child.src.includes("emergent")
                ) {
                    console.log("BLOCKED:", child.src);
                    return child;
                }
                return originalInsertBefore.call(this, child, ref);
            };

            // REMOVE badge instantly
            const removeBadge = () => {
                document
                    .querySelectorAll("#emergent-badge, [id*='emergent'], [class*='emergent']")
                    .forEach(el => el.remove());
            };

            const observer = new MutationObserver(removeBadge);
            observer.observe(document.documentElement, {
                childList: true,
                subtree: true
            });

            removeBadge();
        })();
    </script>

                e.error.name === "DataCloneError"
            ) {
                e.stopImmediatePropagation();
                e.preventDefault();
            }
        }, true);
    </script>
