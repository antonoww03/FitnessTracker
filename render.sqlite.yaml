services:
  - type: web
    name: fittrack
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    numInstances: 1
    healthCheckPath: /api
    envVars:
      - key: FITTRACK_DB_PATH
        value: /app/backend/data/fittrack.sqlite3
      - key: FITTRACK_BACKUP_DIR
        value: /app/backend/data/backups
      - key: FITTRACK_COOKIE_SECURE
        value: "1"
      - key: FITTRACK_AUTO_BACKUP
        value: "1"
      - key: FITTRACK_AUTO_VAPID
        value: "1"
      - key: FITTRACK_VAPID_KEY_FILE
        value: /app/backend/data/vapid.json
      - key: FITTRACK_VAPID_SUBJECT
        value: https://github.com/antonoww03/FitnessTracker
      - key: FITTRACK_PUSH_WORKER
        value: "1"
    disk:
      name: fittrack-data
      mountPath: /app/backend/data
      sizeGB: 1
