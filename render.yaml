# Free backend. DATABASE_URL must point to a separate Supabase PostgreSQL project.
services:
  - type: web
    name: fittrack-api
    runtime: docker
    plan: free
    region: frankfurt
    numInstances: 1
    healthCheckPath: /api
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FITTRACK_REQUIRE_POSTGRES
        value: "1"
      - key: FITTRACK_COOKIE_SECURE
        value: "1"
      - key: FITTRACK_AUTO_BACKUP
        value: "0"
      - key: FITTRACK_AUTO_VAPID
        value: "1"
      - key: FITTRACK_PUSH_WORKER
        value: "1"
